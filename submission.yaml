submission:
  title: ""                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply Chain Disruption Assistant & Fleet
Utilisation Optimizer ■ Ongoing Pain
Supply chain disruptions — weather events, port strikes, geopolitical crises — cascade
across hundreds of active shipments in ways that are impossible to track manually. Fleet
assets (trucks, containers, vessels) sit idle while other routes are overloaded. Cold chain
shipments (vaccines, perishables) are especially vulnerable — a single temperature
excursion across any leg can spoil a $500K+ cargo, but breaches are only discovered at
delivery when it is too late.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Our Bob-powered control tower combines shipment, disruption, fleet, route, and
    IoT sensor data to identify operational risk and recommend explainable actions.
    It maps active disruptions to affected shipments, proposes rerouting and carrier
    alternatives, identifies suitable idle assets for redeployment, and classifies
    cold-chain temperature excursions by severity before delivery..

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Disruption impact mapping across active shipments and routes"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Explainable rerouting and carrier alternative recommendations"
    - "Idle fleet asset discovery and redeployment matching"
    - "Cold-chain temperature excursion detection before delivery"                               # optional 4th
    - "Regulatory severity classification with recommended response actions"                               # optional 5th

  tech_stack:
    languages: []                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

